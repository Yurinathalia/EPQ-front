<div class="bell-wrap">

  <button
    type="button"
    class="bell-trigger"
    (click)="toggle()"
    [attr.aria-expanded]="abierto"
    [class.activo]="abierto"
    aria-label="Notificaciones">

    <svg class="bell-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>

    <span class="count" *ngIf="noLeidas > 0">
      {{ noLeidas > 9 ? '9+' : noLeidas }}
    </span>

  </button>

  <section *ngIf="abierto" class="popover" aria-label="Panel de notificaciones">

    <header class="pop-head">

      <span class="head-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </span>

      <div class="head-copy">
        <h3>Notificaciones</h3>
        <p>{{ noLeidas > 0 ? noLeidas + ' sin leer' : 'Todo al día' }}</p>
      </div>

      <button type="button" class="read-all" (click)="marcarLeidas()"
              [disabled]="noLeidas === 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        Marcar leídas
      </button>

    </header>

    <div class="pop-body">

      <div *ngIf="cargando" class="skeleton" aria-label="Cargando novedades">
        <span></span><span></span><span></span>
      </div>

      <a *ngFor="let n of notificaciones"
         class="notif"
         [routerLink]="n.href"
         (click)="abierto = false">

        <span class="notif-icon" [ngClass]="n.kind" aria-hidden="true">
          {{ n.icon }}
        </span>

        <span class="notif-copy">
          <strong>{{ n.title }}</strong>
          <small>{{ n.detail }}</small>
          <time>{{ n.date | date:'dd MMM · HH:mm' }}</time>
        </span>

        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M9 18l6-6-6-6"/>
        </svg>

      </a>

      <div *ngIf="!cargando && notificaciones.length === 0" class="empty">

        <svg class="empty-art" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <circle cx="36" cy="36" r="34" fill="#eef2ff"/>
          <circle cx="36" cy="35" r="25" fill="#e0e7ff"/>
          <path d="M47 39c0 0-2.5-2.5-2.5-10.5a8.5 8.5 0 0 0-17 0c0 8-2.5 10.5-2.5 10.5h22z"
                stroke="#4f46e5" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M38.9 44a3.2 3.2 0 0 1-5.8 0" stroke="#4f46e5"
                stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="53" cy="51" r="9.5" fill="#22c55e" stroke="#ffffff" stroke-width="3"/>
          <path d="M49 51l2.6 2.6 5-5" stroke="#ffffff" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <strong>No hay notificaciones pendientes</strong>
        <p>Cuando se registre una novedad, te avisaremos en este espacio.</p>

      </div>

    </div>

    <footer class="pop-foot">
      <span class="live-dot" aria-hidden="true"></span>
      Actualizado automáticamente
    </footer>

  </section>

</div>
