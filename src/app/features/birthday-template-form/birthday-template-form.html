<div class="page-container">

  <h1 class="page-title">
    Plantilla de cumpleaños
  </h1>

  <p class="page-subtitle">
    Crea y personaliza plantillas de felicitación de cumpleaños.
  </p>

  <div class="form-card">

    <div class="form-group">

      <label>
        Nombre de la plantilla
      </label>

      <input
        type="text"
        [(ngModel)]="template.name">

    </div>

    <div class="form-group">

      <label>
        Mensaje de cumpleaños
      </label>

      <textarea
        rows="5"
        [(ngModel)]="template.message"></textarea>

    </div>

    <div class="form-group">

      <label>
        Imagen
      </label>

      <input
        id="template-image"
        type="file"
        accept="image/*"
        (change)="onFileSelected($event)"
        hidden>
      <label class="btn btn-primary" for="template-image">Seleccionar imagen</label>
      <span class="file-name" aria-live="polite">{{ selectedFileName }}</span>

    </div>

    <div
      class="preview"
      *ngIf="previewImage">

      <h3>
        Vista previa
      </h3>

      <img
        [src]="previewImage"
        alt="Vista previa de la plantilla">

    </div>

    <div class="checkbox-container">

      <input
        type="checkbox"
        [(ngModel)]="template.active">

      <label>
        Plantilla activa
      </label>

    </div>

    <button
      class="btn btn-success"
      (click)="save()">

      Guardar plantilla

    </button>

  </div>

</div>
